[package]
name = "lemma-rpc"
version = "0.1.0"
edition = "2021"
description = "JSON-RPC and WebSocket server for Lemma: lem_* methods, subscriptions"

[dependencies]
lemma-core    = { path = "../lemma-core" }
lemma-storage = { path = "../lemma-storage" }
lemma-mempool = { path = "../lemma-mempool" }
lemma-vm      = { path = "../lemma-vm" }
lemma-network = { path = "../lemma-network" }
lemma-crypto  = { path = "../lemma-crypto" }
axum          = { workspace = true }
tower-http    = { workspace = true }
tokio         = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
tracing       = { workspace = true }
thiserror     = { workspace = true }
hex           = { workspace = true }

[dev-dependencies]
tokio         = { workspace = true, features = ["test-util"] }
tempfile      = { workspace = true }
lemma-network = { path = "../lemma-network", features = ["test-utils"] }
lemma-storage = { path = "../lemma-storage" }
lemma-mempool = { path = "../lemma-mempool" }
lemma-core    = { path = "../lemma-core" }
# tower::ServiceExt::oneshot — used for body-limit integration tests.
# Pinned to the version axum 0.7 depends on (axum 0.7 requires tower 0.4.x).
tower         = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
