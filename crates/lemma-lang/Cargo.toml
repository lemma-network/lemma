[package]
name = "lemma-lang"
version = "0.1.0"
edition = "2021"
description = "Lem language: lexer, parser, type checker, safety analyzer (12 rules), WASM codegen"

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
bech32 = { workspace = true }
lemma-core = { path = "../lemma-core" }
# WASM emitter backend — deterministic byte emission (decisions-log DB-A50, AGENTS §9.3)
wasm-encoder = { workspace = true }
# Blake3 hashing — function selectors + storage keys (deterministic, AGENTS §7.1)
blake3 = { workspace = true }

[dev-dependencies]
# WASM validator — used in codegen tests to verify emitted bytes are valid WASM.
# Test-only; not a workspace dep since no other crate uses wasmparser in production.
wasmparser = "0.221"
# WASM runtime — used in codegen execution tests to verify emitted WASM produces
# correct runtime results (not just structural validity). Direct dep, NOT via
# lemma-vm (AGENTS §8). Workspace dep pinned in root Cargo.toml.
wasmtime = { workspace = true }
