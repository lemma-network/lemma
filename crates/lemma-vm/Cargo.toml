[package]
name = "lemma-vm"
version = "0.1.0"
edition = "2021"
description = "LemmaVM: WASM execution, gas metering, host functions, Flux parallel execution"

[dependencies]
thiserror    = { workspace = true }
wasmtime     = { workspace = true }
wasmparser   = { workspace = true }  # for "lemma.meta" custom section parsing (B5-3b)
bincode      = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
tracing      = { workspace = true }
anyhow       = { workspace = true }
dashmap      = { workspace = true }
rayon        = { workspace = true }
lemma-core   = { path = "../lemma-core" }
lemma-crypto = { path = "../lemma-crypto" }

[dev-dependencies]
proptest     = { workspace = true }
wasm-encoder = { workspace = true }  # for building test WASM with custom sections
lemma-lang   = { path = "../lemma-lang" }  # for full compiler pipeline E2E test (P3·Step 21 subtask_07)
