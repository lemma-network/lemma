[package]
name = "lemma-mempool"
version = "0.1.0"
edition = "2021"
description = "Transaction mempool for Lemma: priority queue, validation, rate limiting, Express fast path"

[dependencies]
bincode = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
lemma-core = { path = "../lemma-core" }
lemma-crypto = { path = "../lemma-crypto" }
lemma-storage = { path = "../lemma-storage" }

# Shield (src/shield/) — threshold encryption + aggregatable PVSS-DKG over BLS12-381.
# Isolated here; the rest of the mempool is curve-agnostic (15-SHIELD_SPEC §5, §8).
ark-bls12-381 = { workspace = true }
ark-ec = { workspace = true }
ark-ff = { workspace = true }
ark-poly = { workspace = true }
ark-serialize = { workspace = true }
ark-std = { workspace = true }
secret_sharing_and_dkg = { workspace = true }
schnorr_pok = { workspace = true }
dock_crypto_utils = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
blake2 = { workspace = true }
sha2 = { workspace = true }        # sha2 0.11 for HKDF (hkdf 0.13 compatible)
sha2_v010 = { workspace = true }  # sha2 0.10 for arkworks hash-to-curve (DB-13)

[dev-dependencies]
tempfile = { workspace = true }
rand = { workspace = true }
