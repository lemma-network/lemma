[package]
name = "lemma-node"
version = "0.1.0"
edition = "2021"
description = "Lemma full node binary: boots, produces blocks, syncs via P2P"

[[bin]]
name = "lemma-node"
path = "src/main.rs"

[lib]
name = "lemma_node"
path = "src/lib.rs"

[dependencies]
anyhow     = { workspace = true }
tokio      = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
clap       = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
bincode    = { workspace = true }
lemma-core      = { path = "../lemma-core" }
lemma-storage   = { path = "../lemma-storage" }
lemma-crypto    = { path = "../lemma-crypto" }
lemma-mempool   = { path = "../lemma-mempool" }
lemma-consensus = { path = "../lemma-consensus" }

[dev-dependencies]
tempfile = { workspace = true }
