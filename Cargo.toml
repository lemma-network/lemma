[workspace]
resolver = "2"
members = [
    "crates/lemma-core",
    "crates/lemma-crypto",
    "crates/lemma-storage",
    "crates/lemma-network",
    "crates/lemma-mempool",
    "crates/lemma-consensus",
    "crates/lemma-vm",
    "crates/lemma-lang",
    "crates/lemma-transpiler",
    "crates/lemma-privacy",
    "crates/lemma-rpc",
    "crates/lemma-node",
    "crates/lemma-cli",
]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Cryptography & encoding (versions audited 2026-05-30)
blake3 = "1.8"
bech32 = "0.11"
ed25519-dalek = { version = "2.2", features = ["serde", "rand_core"] }
pqcrypto-mldsa = "0.1"            # FIPS-204 ML-DSA (PQClean-backed; replaces stale pqcrypto-dilithium)
pqcrypto-traits = "0.3"          # shared traits for pqcrypto-mldsa
sha2 = "0.11.0"
sha3 = "0.12.0"            # Keccak256 (Ethereum variant, padding 0x01); same digest train as sha2
subtle = "2"

# Utilities
bytes = "1"
hex = "0.4"
rand = "0.8.6"
futures = "0.3"          # StreamExt::select_next_some — Swarm event loop

# Storage
rocksdb = "0.24"

# Testing utilities
tempfile = "3.10"
proptest = "1"

# Flux parallel execution (Block-STM model — aptos-core Apache-2.0 reference)
# DashMap: the SOLE concurrency-container exception (AGENTS §7.1) — used only as
# MvState's multi-version store; its iteration order never escapes (state root is
# collected into sorted BTreeMap before hashing). rayon: bounded worker pool.
dashmap = "6"
rayon = "1.12"

# Networking (0.56 is tokio-only — async-std removed; decisions-log 2026-05-30)
# request-response + cbor: bounded pull-sync (/lemma/sync/1) via CBOR codec
# (12-NETWORK_SYNC_SPEC §2.2, §1 transport table)
libp2p = { version = "0.56", features = [
    "tokio", "tcp", "noise", "yamux",
    "gossipsub",
    "request-response", "cbor",
    "kad", "identify", "mdns", "ping",
] }

# VM (fuel metering, OSS-Fuzz, formal verification — chosen over wasmer for metered execution)
wasmtime = "45"

# WASM emitter (codegen backend — deterministic byte emission, bytecodealliance/wasm-tools suite)
# Pinned exact per AGENTS §9.3; versioned in lockstep with wasmtime. See decisions-log DB-A50.
wasm-encoder = "=0.251.0"

# ZK (Veil — BLS12-377 + decaf377, Penumbra stack).
# PINNED to arkworks 0.4.x to match Penumbra's audited circuits + trusted-setup
# parameters (reuse requires byte-identical circuits + matching crate versions).
# This is the ONE place Lemma intentionally pins below latest — circuit/param
# compatibility overrides currency. See 10-PRIVACY_SPEC.md §3.
ark-ec = { version = "=0.4.2", default-features = false }
ark-ff = { version = "=0.4.2", default-features = false }
ark-groth16 = { version = "=0.4.0", default-features = false }
ark-r1cs-std = { version = "=0.4.0", default-features = false }
ark-relations = "=0.4"
ark-serialize = "=0.4.2"
ark-snark = "=0.4.0"
ark-std = { version = "=0.4", default-features = false }
ark-bls12-377 = { version = "=0.4", default-features = false }
decaf377 = { version = "=0.10.1", default-features = false }
poseidon377 = "=1.2.0"
decaf377-rdsa = "=0.11.0"

# Shield (encrypted mempool — threshold encryption / aggregatable PVSS-DKG / resharing).
# BLS12-381 pairing crypto, isolated in lemma-mempool/src/shield/ (15-SHIELD_SPEC).
# PINNED to arkworks 0.4.x to share Veil's single ark-* train per process (15-SPEC §1.4, §9)
# — one binary, no duplicate-ark ABI conflict. Licenses verified live 2026-06-02:
# docknetwork crates = Apache-2.0; arkworks/AEAD/KDF = MIT/Apache (AGENTS §9.3 permissive-only).
ark-bls12-381 = { version = "=0.4", features = ["curve"] }  # "curve" enables Fr/G1/G2 (required for Shield TPKE)
ark-poly = { version = "=0.4.2", default-features = false }
secret_sharing_and_dkg = "0.16.0"      # Shamir/Feldman/Pedersen VSS + lagrange_basis_at_0_for_all
schnorr_pok = "0.23.0"                  # Schnorr PoK building blocks → compose Chaum-Pedersen DLEQ (§3)
dock_crypto_utils = "0.23.0"            # ElGamal base, compute_random_oracle_challenge (Fiat-Shamir)
chacha20poly1305 = "0.10"               # AEAD, RFC 8439 (§1.3)
hkdf = "0.13"                           # HKDF-SHA256 symmetric-key derivation (§1.3)
blake2 = "0.10"                         # Blake2b512 Fiat-Shamir challenge hash (§1.3)
# arkworks 0.4.x DefaultFieldHasher requires digest 0.10 (sha2 0.10) — conflicts with
# lemma-crypto's sha2 0.11 (digest 0.11 train). Isolated via rename: only used in
# shield/tpke.rs hash_to_g2(). HKDF uses sha2 0.11 (fine with hkdf 0.13/digest 0.11).
# See decisions-log DB-13. AGENTS §9.3 — both Apache-2.0 / MIT.
sha2_v010 = { package = "sha2", version = "0.10", default-features = false }

# RPC
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
tokio-tungstenite = "0.23"
async-graphql = "7"

# CLI
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
